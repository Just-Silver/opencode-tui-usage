name: Release

# 手动打 tag 触发（GitHub 官方标准发布流程）：
#   改 update/version.ts 的 VERSION → commit → git tag v1.1.0 → git push origin v1.1.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # gh release create 需要

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 tag 与 VERSION 一致
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          IN_CODE="$(grep -oP 'VERSION = "\K[0-9]+\.[0-9]+\.[0-9]+' .opencode/plugins/tui/opencode-tui-usage/update/version.ts)"
          echo "tag=$TAG"
          echo "code=$IN_CODE"
          if [ "$TAG" != "$IN_CODE" ]; then
            echo "::error::tag ($TAG) 与 update/version.ts VERSION ($IN_CODE) 不一致"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true # 自动生成变更说明（commit 列表）
          draft: false
          prerelease: false
